name: CI

on:
  push:
    branches: [master, 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC and Firebird
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc firebird3.0-server-core firebird3.0-utils libib-util libfbclient2

      - name: Build UDF modules
        run: |
          set -e
          # сначала разделяемый менеджер памяти, от него зависят остальные
          (cd src/afmmngr && fpc -B -Mobjfpc afmmngr.lpr)
          for m in afcommon afucrypt afudbf afufile afumisc afutextfile afuxml afuzip; do
            (cd "src/$m" && fpc -B -Mobjfpc -Fu../common -Fu../cmnunits -Fi../common -Fl../afmmngr "$m.lpr")
          done

      - name: Deploy UDF modules
        run: |
          UDFDIR=$(dpkg -L firebird3.0-server-core | grep -m1 '/UDF$')
          echo "UDF dir: $UDFDIR"
          # Firebird ищет модуль по MODULE_NAME без префикса "lib"
          # и при UdfAccess=Restrict не принимает симлинки — только файлы
          for f in src/*/lib*.so; do
            base=$(basename "$f")
            sudo cp "$f" "$UDFDIR/${base#lib}"
          done
          # libafmmngr.so — runtime-зависимость модулей
          sudo cp src/afmmngr/libafmmngr.so /usr/lib/
          sudo ldconfig

      - name: Enable UDF access
        # в Debian/Ubuntu по умолчанию UdfAccess = None
        run: sudo sed -i 's/^UdfAccess = None/UdfAccess = Restrict UDF/' /etc/firebird/3.0/firebird.conf

      - name: Run SQL test suite
        run: |
          mkdir -p /tmp/firebird
          # embedded-режим: подключение по локальному пути, без сервера и пароля SYSDBA
          sed "s|localhost:/tmp/firebird/|/tmp/firebird/|g" tests/createdbtest.sql > ci_test.sql
          ISQL=$(command -v isql-fb || command -v isql)
          "$ISQL" -i ci_test.sql | tee ci_output.txt
          if grep -qE 'Statement failed|SQLSTATE' ci_output.txt; then
            echo "::error::SQL test suite failed, see log above"
            exit 1
          fi
          echo "All tests passed"

      - name: Upload built libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afudf-linux-x86_64
          path: src/*/lib*.so
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32, cpu: i386 }
          - { target: win64, cpu: x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Install FPC 3.2.2 (win32 + win64)
        shell: pwsh
        run: |
          # Invoke-WebRequest плохо дружит с SourceForge (скачивает HTML вместо exe),
          # поэтому curl.exe — он предустановлен на windows-раннерах
          $urls = @(
            "https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe",
            "https://ftp.freepascal.org/pub/fpc/dist/3.2.2/i386-win32/fpc-3.2.2.win32.and.win64.exe"
          )
          $ok = $false
          foreach ($u in $urls) {
            Write-Host "Downloading $u"
            curl.exe -fSL --retry 3 --retry-all-errors -o fpc-setup.exe $u
            if ($LASTEXITCODE -eq 0 -and (Get-Item fpc-setup.exe).Length -gt 10MB) { $ok = $true; break }
            Write-Host "download failed or file too small, trying next mirror"
          }
          if (-not $ok) { throw "Failed to download FPC installer from all mirrors" }
          Start-Process .\fpc-setup.exe -ArgumentList '/VERYSILENT','/NORESTART' -Wait
          Add-Content $env:GITHUB_PATH "C:\fpc\3.2.2\bin\i386-win32"

      - name: Build UDF modules
        shell: pwsh
        run: |
          $t = "${{ matrix.target }}"; $c = "${{ matrix.cpu }}"
          Push-Location src/afmmngr
          fpc -B -Mobjfpc "-T$t" "-P$c" afmmngr.lpr
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location
          foreach ($m in 'afcommon','afucrypt','afudbf','afufile','afumisc','afutextfile','afuxml','afuzip') {
            Push-Location "src/$m"
            fpc -B -Mobjfpc "-T$t" "-P$c" -Fu../common -Fu../cmnunits -Fi../common -Fl../afmmngr "$m.lpr"
            if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
            Pop-Location
          }

      - name: Check built DLLs
        shell: pwsh
        run: |
          $dlls = Get-ChildItem src -Filter *.dll -Recurse
          $dlls | ForEach-Object FullName
          if ($dlls.Count -lt 9) { throw "Expected 9 DLLs, got $($dlls.Count)" }

      - name: Upload DLLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afudf-${{ matrix.target }}
          path: src/**/*.dll
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for d in */; do
            (cd "$d" && zip -r "../afudf-${d%/}.zip" .)
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.zip
